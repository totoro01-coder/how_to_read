<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding:0}html,body{margin:0}</style></head><body><title>독서 카드게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 1280x800 논리 테이블을 화면에 맞춰 줄여 쓴다. 위쪽에 점수 트랙, 좌우 상단에 더미, 가운데에 자리·책, 아래에 손패. */
:root{
  color-scheme:light;
  --bg:#f4f4f4; --surface:#ffffff; --line:#d2d2d2; --veil:rgba(244,244,244,.84);
  --ink:#1b1b1b; --muted:#6b6b6b; --accent:#1f1f1f; --accent-ink:#f4f4f4; --bad:#a8392d;
  --plate:#ffffff; --ink-card:#1b1b1b; --muted-card:#5c5c5c; --line-card:rgba(0,0,0,.16);
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --display:"Gowun Batang","Noto Serif KR",serif;
  --dur:620ms;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;overflow:hidden;padding-inline:16px;padding-block:8px}
button{font:inherit;color:inherit}
#vp{position:relative;width:100%;height:100%}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:800px;transform-origin:50% 50%;overflow:hidden;border-radius:14px;
  background:var(--bg);box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.08)}
.abs{position:absolute}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* 머리줄 */
#hud{position:absolute;left:0;top:0;width:1280px;height:68px;z-index:20}
#brand{position:absolute;left:28px;top:14px;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.01em}
#brand small{display:block;font-family:var(--sans);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0;margin-top:-2px}
#scorenum{position:absolute;left:236px;top:15px;width:96px;text-align:right;font-family:var(--mono);font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
#scorenum span{font-size:15px;color:var(--muted);font-weight:500}
#scorecap{position:absolute;left:236px;top:46px;width:96px;text-align:right;font-size:12px;color:var(--muted)}
#track{position:absolute;left:356px;top:30px;width:620px;height:10px;border-radius:5px;background:#dedede;box-shadow:inset 0 0 0 1px var(--line)}
#tfill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:#2b2b2b;width:0;transition:width var(--dur) cubic-bezier(.22,.8,.26,1)}
#ttok{position:absolute;top:-9px;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:#1f1f1f;box-shadow:0 2px 6px rgba(0,0,0,.3),inset 0 0 0 3px #5a5a5a;left:0;transition:left var(--dur) cubic-bezier(.22,.8,.26,1)}
#ttok::after{content:"";position:absolute;left:11px;top:5px;width:6px;height:18px;border-radius:3px;background:#f4f4f4}
.tmark{position:absolute;top:18px;font-family:var(--mono);font-size:11px;color:var(--muted);transform:translateX(-50%)}
.ttick{position:absolute;top:2px;width:1px;height:6px;background:rgba(0,0,0,.25)}
.tflag{position:absolute;top:-22px;transform:translateX(-50%);font-size:11px;color:var(--ink);font-weight:500;white-space:nowrap}
.pop{position:absolute;font-family:var(--mono);font-weight:600;font-size:26px;pointer-events:none;animation:popup 1.2s ease-out forwards;z-index:30;text-shadow:0 1px 4px rgba(244,244,244,.95)}
.pop.up{color:var(--ink)} .pop.down{color:var(--bad)}
@keyframes popup{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
#hbtns{position:absolute;right:28px;top:16px;display:flex;gap:8px}
.hb{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 14px;cursor:pointer;font-size:13px;font-weight:500}
.hb:hover{border-color:var(--accent)}

/* 자리 표시 */
.slot{position:absolute;border:2px dashed rgba(0,0,0,.16);border-radius:14px;pointer-events:none}
.slot::after{content:attr(data-lb);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);opacity:.7;font-size:15px;letter-spacing:.3em}
.slotlb{position:absolute;font-size:12px;color:var(--muted);text-align:center;pointer-events:none;letter-spacing:.04em;width:170px;margin-left:-85px}
.slotlb b{display:block;font-family:var(--mono);font-size:15px;color:var(--ink);font-weight:600}

/* 드롭 구역 */
.dz{position:absolute;border-radius:16px;border:2px dashed transparent;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;
  font-size:13px;font-weight:600;color:transparent;pointer-events:none;transition:background .15s,border-color .15s;z-index:350}
.dz.on{border-color:var(--accent);background:rgba(0,0,0,.05);color:var(--accent);pointer-events:auto;cursor:pointer}
.dz.off{border-color:rgba(168,57,45,.6);background:rgba(168,57,45,.06);color:var(--bad);pointer-events:auto}
.dz.hover{background:rgba(0,0,0,.12)}

/* 카드 */
#cards{position:absolute;left:0;top:0;width:1280px;height:800px}
.card{position:absolute;left:0;top:0;width:630px;height:880px;transform-origin:315px 440px;transition:transform var(--dur) cubic-bezier(.22,.8,.26,1);pointer-events:none;user-select:none;-webkit-user-select:none}
#cards.noanim .card,#cards.noanim .flip{transition:none!important}
.card.dragging{transition:none!important;z-index:900!important}
.card.live{pointer-events:auto}
.card.hand{touch-action:none}
.lift{position:absolute;inset:0;perspective:1800px;transition:transform .22s cubic-bezier(.2,.8,.3,1)}
.card.hand:not(.dragging):hover .lift,.card.hand:not(.dragging):focus-visible .lift,.card.hand.sel:not(.dragging) .lift{transform:translateY(-270px) scale(1.45)}
.card.hand:not(.dragging):hover,.card.hand.sel:not(.dragging),.card.hand:not(.dragging):focus-visible{z-index:950!important}
.card.dragging .lift{transform:none}
.card.live.look:hover .lift{transform:scale(1.08)}
.card.hot,.card.tgt{z-index:650!important}
.card.tgt .lift{filter:drop-shadow(0 0 26px rgba(0,0,0,.55))}
.card.ok .lift::after{content:"";position:absolute;inset:-6px;border-radius:36px;box-shadow:0 0 0 7px rgba(0,0,0,.4);pointer-events:none}
.card.hot .lift::after{content:"";position:absolute;inset:-6px;border-radius:36px;box-shadow:0 0 0 9px rgba(0,0,0,.88);pointer-events:none}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform calc(var(--dur)*.75) ease}
.flip.down{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:30px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 8px 22px rgba(0,0,0,.24)}
.face.front{background:#eaeaea}
.face.back{transform:rotateY(180deg);background-size:cover;background-position:center}
.art{position:absolute;inset:0;width:630px;height:880px;display:block}
.art svg{width:630px;height:880px;display:block}
.ov{position:absolute;background:var(--plate);border-radius:18px;color:var(--ink-card);box-shadow:0 1px 0 rgba(255,255,255,.4) inset}
.ov.title{left:30px;top:28px;width:570px;height:112px;padding:10px 22px;display:flex;flex-direction:column;justify-content:center}
.ov .tag{position:absolute;right:20px;top:8px;font-size:24px;font-weight:600;letter-spacing:.1em}
.ov .nm{font-weight:600;line-height:1.12;white-space:nowrap}
.ov .sub{font-size:26px;color:var(--muted-card);margin-top:3px;white-space:nowrap;min-height:30px}
.ov.stats{left:30px;top:686px;width:570px;height:166px;padding:8px 14px}
.ov .row1{height:46px;display:flex;gap:10px;align-items:center;font-size:26px;white-space:nowrap}
.ov .chip{display:inline-block;padding:1px 16px;border-radius:99px;font-weight:600;font-size:25px}
.ov .cells{display:flex;height:100px;margin-top:2px}
.ov .cell{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:center;border-left:2px solid var(--line-card);min-width:0}
.ov .cell:first-child{border-left:0}
.ov .lb{font-size:22px;color:var(--muted-card);white-space:nowrap}
.ov .v{font-size:60px;font-family:var(--mono);font-weight:600;line-height:1.05}
.ov .cell.z .v{opacity:.3}
.ov .big{display:flex;align-items:center;justify-content:center;height:100px;font-size:40px;font-weight:600;text-align:center;line-height:1.2}
.ov .ln{font-size:27px;line-height:1.35;white-space:nowrap}
.ov .ln b{font-weight:600}

/* 안내 글 */
#log{position:absolute;left:28px;top:352px;width:290px;height:150px;font-size:13px;color:var(--muted);overflow:hidden;z-index:10;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 40%);mask-image:linear-gradient(to bottom,transparent 0,#000 40%)}
#log div b{font-family:var(--mono);font-weight:500;color:var(--ink);margin-right:6px}
#log div:last-child{color:var(--ink)}
#desc{position:absolute;left:360px;top:72px;width:570px;min-height:34px;text-align:center;font-size:13px;line-height:1.35;color:var(--ink);z-index:310;pointer-events:none;text-wrap:balance;padding:4px 12px;border-radius:10px}
#desc.has{background:rgba(0,0,0,.06)}
#toast{position:absolute;left:50%;top:456px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--bad);color:var(--bad);padding:8px 16px;border-radius:10px;font-size:14px;font-weight:500;z-index:1100;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
#toast.on{opacity:1}
#tokens{position:absolute;z-index:12;display:flex;gap:7px;align-items:center;justify-content:center;transform:translateX(-50%)}
.tk{width:20px;height:20px;border-radius:50%;border:2px solid rgba(0,0,0,.32);background:transparent;transition:background .3s,border-color .3s,transform .3s}
.tk.f{background:#2b2b2b;border-color:#111;transform:scale(1.08)}
.tk.o{background:var(--bad);border-color:#7e2a21;transform:scale(1.08)}
#tkcap{position:absolute;z-index:12;width:260px;margin-left:-130px;text-align:center;font-size:12px;color:var(--muted)}
#bookcap{position:absolute;z-index:12;width:220px;margin-left:-110px;text-align:center;font-size:12px;color:var(--muted)}
#bookcap b{color:var(--ink);font-weight:500;display:block}

/* 방해·책 고르기 */
#veil{position:absolute;inset:0;background:var(--veil);z-index:300;opacity:0;pointer-events:none;transition:opacity .3s}
#veil.on{opacity:1}
#stage.offering .slotlb,#stage.offering .slot{opacity:0}
.slotlb,.slot{transition:opacity .3s}
#pp{position:absolute;left:850px;top:126px;width:340px;z-index:700;display:none;background:var(--surface);border:1px solid #bdbdbd;box-shadow:0 14px 40px rgba(0,0,0,.14);border-radius:14px;padding:16px}
#pp.on{display:block}
#pp .k{font-size:12px;color:var(--muted);letter-spacing:.1em;font-weight:600}
#pp h3{margin:2px 0 6px;font-family:var(--display);font-size:24px}
#pp p{margin:0 0 10px;font-size:13px;color:var(--muted)}
#pp .opts{display:flex;flex-direction:column;gap:7px}
.ob{background:#fafafa;border:1px solid var(--line);border-radius:9px;padding:8px 12px;text-align:left;cursor:pointer;font-weight:500;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ob:hover:not(:disabled){border-color:var(--accent);background:rgba(0,0,0,.04)}
.ob:disabled{opacity:.4;cursor:not-allowed}
.ob small{color:var(--muted);font-weight:400;font-size:12px}
.ob.pri{border-color:var(--accent);color:var(--ink);font-weight:600}
#bp{position:absolute;left:340px;top:78px;width:600px;text-align:center;z-index:700;display:none}
#bp.on{display:block}
#bp h3{margin:0;font-family:var(--display);font-size:26px}
#bp p{margin:4px 0 0;color:var(--muted);font-size:13px}
.offlb{position:absolute;z-index:700;width:250px;margin-left:-125px;text-align:center;font-size:13px;color:var(--ink);display:none}
.offlb.on{display:block}
.offlb b{display:block;font-size:15px;margin-bottom:2px}
.offlb span{color:var(--muted);font-size:12px;display:block}

/* 오버레이 */
.ovl{position:absolute;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:rgba(244,244,244,.86)}
.ovl.on{display:flex}
.sheet{width:660px;max-height:720px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:30px 34px;box-shadow:0 30px 80px rgba(0,0,0,.14)}
.sheet h1{margin:0 0 4px;font-family:var(--display);font-size:38px;line-height:1.15;text-wrap:balance}
.sheet h2{margin:20px 0 6px;font-size:13px;color:var(--muted);letter-spacing:.1em}
.sheet p,.sheet li{font-size:14px;color:#3a3a3a;max-width:60ch}
.sheet ol,.sheet ul{padding-left:20px;margin:6px 0}
.sheet li{margin:4px 0}
.sheet .row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 20px;cursor:pointer;font-weight:600;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#end .sheet{text-align:center;width:560px}
#end .res{font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:600}
#end .res.win{color:var(--ink)} #end .res.lose{color:var(--bad)}
#end .ename{font-family:var(--display);font-size:40px;font-weight:700;margin:10px 0 8px;text-wrap:balance;line-height:1.2}
#end .meta{font-family:var(--mono);color:var(--muted);font-size:14px}
#end .row{justify-content:center}
.setrow{display:flex;gap:10px;align-items:center;margin:10px 0;font-size:14px}
.setrow input{width:18px;height:18px;accent-color:var(--accent)}
.setrow small{color:var(--muted)}
#portrait{display:none;position:absolute;inset:0;z-index:2000;background:var(--bg);align-items:center;justify-content:center;text-align:center;padding:30px;font-family:var(--display);font-size:22px}
@media (max-aspect-ratio:1/1){#portrait{display:flex}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<div id="vp">
  <div id="stage">
    <div id="hud">
      <div id="brand">독서 카드게임<small>방에 들어가 책을 읽는 한 판</small></div>
      <div id="scorenum"></div><div id="scorecap">점수 / 목표</div>
      <div id="track"></div>
      <div id="hbtns">
        <button class="hb" id="b-rules" type="button">규칙</button>
        <button class="hb" id="b-set" type="button">설정</button>
        <button class="hb" id="b-new" type="button">새 판</button>
      </div>
    </div>
    <div id="slots"></div>
    <div class="dz" id="dz-seat"></div><div class="dz" id="dz-read"></div><div class="dz" id="dz-discard"></div>
    <div id="cards" class="noanim"></div>
    <div id="tokens"></div><div id="tkcap"></div><div id="bookcap"></div>
    <div id="log" aria-hidden="true"></div>
    <div id="desc"></div>
    <div id="toast"></div>
    <div id="veil"></div>
    <div id="bp"><h3>읽을 책을 한 권 고르세요</h3><p>방 안에 놓여 있는 책이에요. 위치와 상태가 이번 판의 효과를 정해요.</p></div>
    <div id="offlbs"></div>
    <div id="pp" role="group" aria-label="방해 처리"></div>

    <div class="ovl on" id="intro"><div class="sheet" id="introbox"></div></div>
    <div class="ovl" id="rules"><div class="sheet" id="rulesbox"></div></div>
    <div class="ovl" id="settings"><div class="sheet" style="width:460px">
      <h1 style="font-size:28px">설정</h1>
      <div class="setrow"><input type="checkbox" id="s-hint"><label for="s-hint">낼 수 있는 카드 테두리 표시 <small>(기본 꺼짐)</small></label></div>
      <div class="setrow"><input type="checkbox" id="s-sound"><label for="s-sound">효과음 <small>(기본 꺼짐)</small></label></div>
      <div class="setrow"><input type="checkbox" id="s-reduce"><label for="s-reduce">움직임 줄이기 <small>(시스템 설정도 따라가요)</small></label></div>
      <div class="row"><button class="btn pri" type="button" data-close="settings">닫기</button></div>
    </div></div>
    <div class="ovl" id="end"><div class="sheet" id="endbox"></div></div>
  </div>
  <div id="portrait">화면을 가로로 돌려서 열어주세요.<br>카드를 펼쳐 놓을 자리가 가로로 넓어야 해요.</div>
  <div class="sr" id="live" aria-live="polite"></div>
</div>

<script>
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,rng){for(var i=arr.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}
function seatEff(cfg,s,bonus){return (s.base+(bonus||0)+s.limit*cfg.pagePts)/(1+s.entry+s.limit*(1+s.cons));}
function ctrBlocks(cfg,ci,di){var c=cfg.ctrs[ci],d=cfg.dists[di];return c.blocks===d.name||c.blocks.indexOf('아무')===0;}
var BOOKS=[{pos:'책장',open:false},{pos:'책상',open:false},{pos:'책상',open:true},{pos:'침대',open:false},{pos:'침대',open:true},{pos:'바닥',open:false},{pos:'바닥',open:true}];
function bookName(b){return b.pos==='책장'?'책장에 꽂힌 책':b.pos+' 위 '+(b.open?'펼쳐진 책':'덮인 책');}
function bookOn(cfg){return !!(cfg.modules&&cfg.modules.book&&cfg.book);}
function endingOf(cfg,result,deckLeft,sleepSeen,seatIdx){
  if(!cfg.modules||!cfg.modules.ending||!cfg.ending)return null;
  var e=cfg.ending;
  if(result==='win')return deckLeft>=e.deckLeft?'아껴 읽기 위해 멈춘다':'별다른 이유 없이 그냥 마무리한다';
  var lying=seatIdx!==null&&seatIdx!==undefined&&cfg.seats[seatIdx].posture==='눕기';
  return (sleepSeen>=e.sleepCount||lying)?'졸음이 쏟아져 잠에 든다':'집중력이 떨어져 덮는다';
}
var ENDINGS=['아껴 읽기 위해 멈춘다','별다른 이유 없이 그냥 마무리한다','졸음이 쏟아져 잠에 든다','집중력이 떨어져 덮는다'];
function deckSize(cfg){var n=cfg.pageCount;cfg.seats.forEach(function(s){n+=s.n;});cfg.dists.forEach(function(s){n+=s.n;});cfg.ctrs.forEach(function(s){n+=s.n;});return n;}

function newGame(cfg,rng,opts){
  opts=opts||{};
  var deck=[],i,k;
  for(k=0;k<cfg.pageCount;k++)deck.push({t:'page'});
  cfg.seats.forEach(function(s,i){for(k=0;k<s.n;k++)deck.push({t:'seat',i:i});});
  cfg.dists.forEach(function(s,i){for(k=0;k<s.n;k++)deck.push({t:'dist',i:i});});
  cfg.ctrs.forEach(function(s,i){for(k=0;k<s.n;k++)deck.push({t:'ctr',i:i});});
  shuffle(deck,rng);
  var st={cfg:cfg,deck:deck,discard:[],readPile:[],hand:[],score:0,peak:0,seat:null,seatCard:null,reads:0,pagesRead:0,
    over:false,result:null,pending:null,turn:1,log:[],endOnTarget:opts.endOnTarget!==false,
    reach:[],ending:null,book:null,bookOffer:null,
    stats:{stuck:0,overReads:0,dist:0,blocked:0,dcost:0,sleepSeen:0,bookSaved:0,openCost:0,posBonus:0,seatPts:{},seatPlays:{},seatReads:{}}};
  if(bookOn(cfg)){
    if(opts.book!==undefined&&opts.book!==null)setBook(st,opts.book);
    else{
      var idx=shuffle(BOOKS.map(function(_,i){return i;}),rng);
      st.bookOffer=idx.slice(0,Math.max(1,Math.min(BOOKS.length,Math.round(cfg.book.deal))));
    }
  }
  if(!st.bookOffer)advance(st);
  return st;
}
function setBook(st,i){

}
function chooseBook(st,i){

}

}
function checkWin(st){
  if(!st.over&&st.endOnTarget&&st.score>=st.cfg.target){st.over=true;st.result='win';st.ending=endingOf(st.cfg,'win',st.deck.length,st.stats.sleepSeen,st.seat);log(st,'목표 점수에 도달했어요.');}
}
function checkDeck(st){
  if(!st.over&&st.deck.length===0){st.over=true;st.result='lose';st.ending=endingOf(st.cfg,'lose',0,st.stats.sleepSeen,st.seat);log(st,'덱이 바닥났어요.');}
}
function burn(st,n){
  for(var k=0;k<n&&!st.over;k++){
    if(st.deck.length===0)break;
    st.discard.push(st.deck.pop());
    checkDeck(st);
  }
}
function advance(st){
  while(!st.over&&!st.pending&&st.hand.length<st.cfg.hand){
    var c=st.deck.pop();
    if(c.t==='dist'){st.pending={card:c};if(st.cfg.dists[c.i].name==='졸음')st.stats.sleepSeen++;}else st.hand.push(c);
    checkDeck(st);
  }
}
function pendingOptions(st){
  var d=st.cfg.dists[st.pending.card.i],opts={counters:[],loss:d.loss,deck:d.deck,ret:Math.min(d.ret,st.pagesRead),book:false};
  if(bookOn(st.cfg)&&st.book&&st.book.open&&d.name==='읽던 곳을 잃음'&&st.book.used<st.cfg.book.foldIgnore)opts.book=true;
  if(st.seat!==null&&d.name==='졸음')opts.loss+=st.cfg.seats[st.seat].sleepx;
  st.hand.forEach(function(c,hi){if(c.t==='ctr'&&ctrBlocks(st.cfg,c.i,st.pending.card.i))opts.counters.push(hi);});
  return opts;
}
function resolve(st,choice){
  if(!st.pending||st.over)return false;
  var d=st.cfg.dists[st.pending.card.i],o=pendingOptions(st);
  if(choice.kind==='counter'&&o.counters.indexOf(choice.hi)<0)return false;
  if(choice.kind==='book'&&!o.book)return false;
  if(choice.kind==='ret'&&o.ret<=0)return false;
  if(['counter','book','loss','deck','ret'].indexOf(choice.kind)<0)return false;
  st.stats.dist++;
  if(choice.kind==='book'){
    st.book.used++;st.stats.bookSaved++;log(st,d.name+' 방해를 펼쳐 둔 책으로 막았어요. 읽던 곳이 바로 보여요.');
  }else if(choice.kind==='counter'){
    st.discard.push(st.hand.splice(choice.hi,1)[0]);st.stats.blocked++;
    log(st,d.name+' 방해를 무마 카드로 막았어요.');
  }else if(choice.kind==='loss'){
    bump(st,-o.loss);st.stats.dcost+=o.loss;log(st,d.name+': 점수 −'+o.loss);
  }else if(choice.kind==='deck'){
    st.stats.dcost+=o.deck;burn(st,o.deck);log(st,d.name+': 덱 '+o.deck+'장 소모');
  }else if(choice.kind==='ret'){
    st.pagesRead-=o.ret;bump(st,-o.ret*st.cfg.pagePts);st.stats.dcost+=o.ret*st.cfg.pagePts;
    for(var k=0;k<o.ret;k++){var pc=st.readPile.pop();if(st.cfg.retToHand)st.hand.push(pc);else st.discard.push(pc);}
    log(st,d.name+': 페이지 '+o.ret+'장 반납');
  }else return false;
  st.discard.push(st.pending.card);st.pending=null;
  advance(st);

}
function seatLegal(st,hi){
  var c=st.hand[hi];if(!c||c.t!=='seat'||st.over||st.pending)return false;
  if(st.seat===null)return true;
  var a=st.cfg.seats[c.i],b=st.cfg.seats[st.seat],m=st.cfg.switchRule;
  if(m==='space')return a.space!==b.space;
  if(m==='posture')return a.posture!==b.posture;
  return true;
}
function pageLegal(st,hi){var c=st.hand[hi];return !!c&&c.t==='page'&&st.seat!==null&&!st.over&&!st.pending;}
function endTurn(st){if(st.over)return;st.turn++;advance(st);}
function seatBonus(cfg,book,s){return (bookOn(cfg)&&book&&book.pos===s.space)?(cfg.book.posBonus||0):0;}
function playSeat(st,hi){
  if(!seatLegal(st,hi))return false;

  var bonus=seatBonus(st.cfg,st.book,s);
  st.stats.seatPts[c.i]=(st.stats.seatPts[c.i]||0)+s.base+bonus;st.stats.posBonus+=bonus;
  bump(st,s.base+bonus);log(st,s.name+' 자리를 잡았어요. +'+s.base+(bonus?' (책과 같은 공간 +'+bonus+')':''));
  checkWin(st);

  endTurn(st);return true;
}
function playPage(st,hi){
  if(!pageLegal(st,hi))return false;

  bump(st,d);
  st.stats.seatPts[st.seat]=(st.stats.seatPts[st.seat]||0)+d;
  st.stats.seatReads[st.seat]=(st.stats.seatReads[st.seat]||0)+1;
  log(st,'페이지를 읽었어요. '+txt);
  checkWin(st);

    st.book.opened=true;var oc=st.cfg.book.openCost;

  }
  if(!st.over&&s.cons>0){burn(st,s.cons);log(st,'소모: 덱 '+s.cons+'장');}
  endTurn(st);return true;
}
function discardCard(st,hi){
  if(st.over||st.pending||!st.hand[hi])return false;
  st.discard.push(st.hand.splice(hi,1)[0]);log(st,'카드 1장을 버렸어요.');
  endTurn(st);return true;
}

function botResolve(st){
  var o=pendingOptions(st),d=st.cfg.dists[st.pending.card.i];
  if(o.book)return resolve(st,{kind:'book'});
  if(o.counters.length){
    var pick=o.counters[0];
    for(var k=0;k<o.counters.length;k++){var c=st.cfg.ctrs[st.hand[o.counters[k]].i];if(c.blocks.indexOf('아무')!==0){pick=o.counters[k];break;}}
    return resolve(st,{kind:'counter',hi:pick});
  }
  var opts=[[o.loss*1.0,'loss'],[o.deck*1.0,'deck']];
  if(o.ret>0)opts.push([o.ret*1.8,'ret']);
  opts.sort(function(a,b){return a[0]-b[0];});
  return resolve(st,{kind:opts[0][1]});
}
function botTurn(st){
  var cfg=st.cfg,pg=[],legal=[],seatsH=[],best=-1,bestEff=-1e9;
  st.hand.forEach(function(c,hi){
    if(c.t==='page')pg.push(hi);
    if(c.t==='seat'){seatsH.push(hi);if(seatLegal(st,hi)){legal.push(hi);var sb=cfg.seats[c.i],e=seatEff(cfg,sb,seatBonus(cfg,st.book,sb));if(e>bestEff){bestEff=e;best=hi;}}}
  });
  var readsLeft=st.seat!==null?cfg.seats[st.seat].limit-st.reads:0;
  var want=best>=0&&(st.seat===null||readsLeft<=0||cfg.seats[st.hand[best].i].base+seatBonus(cfg,st.book,cfg.seats[st.hand[best].i])>=3);
  if(want)return playSeat(st,best);
  if(st.seat!==null&&pg.length&&(readsLeft>0||cfg.pagePts-cfg.penalty-cfg.seats[st.seat].cons>0))return playPage(st,pg[0]);
  st.stats.stuck++;
  if(pg.length>1)return discardCard(st,pg[0]);
  if(seatsH.length)return discardCard(st,seatsH[0]);
  if(pg.length)return discardCard(st,pg[0]);
  return discardCard(st,st.hand.length-1);
}
function botGame(cfg,rng,endOnTarget,bookVals,forcedBook){
  var st=newGame(cfg,rng,{endOnTarget:endOnTarget,book:forcedBook});
  if(st.bookOffer){
    var pick=st.bookOffer[0];
    if(bookVals)st.bookOffer.forEach(function(i){if(bookVals[i]>bookVals[pick])pick=i;});
    chooseBook(st,pick);
  }
  var guard=0;
  while(!st.over&&guard++<2000){
    if(st.pending)botResolve(st);else botTurn(st);
  }

}
function gameRng(seed,g){return mulberry32((seed*1000003+g*7919)|0);}
function bookValues(cfg,M,seed){
  if(!bookOn(cfg))return null;
  return BOOKS.map(function(_,b){var t=0;for(var g=0;g<M;g++)t+=botGame(cfg,gameRng(seed||777,g),false,null,b).peak;return t/M;});

function runBots(cfg,n,seed,bookVals){

}

  case 'seat': T={x:P.seat.x,y:P.seat.y,s:S.seat,r:0,up:true,zi:100,live:true,look:true};break;

/* 움직임 순서: 낸 카드 → 소모된 카드 → 새로 뽑는 카드 */
function computeDelays(prev,now){
  var map={},burn=[],draw=[],ret=[],other=[];
  now.forEach(function(zn,uid){
    var p=prev.get(uid);if(!p||p.z===zn.z)return;
    if(uid[0]==='b'){other.push([uid,p,zn]);return;}
    if(p.z==='deck'&&zn.z==='discard')burn.push([uid,p.k]);
    else if(p.z==='deck'&&(zn.z==='hand'||zn.z==='pending'))draw.push([uid,zn]);
    else if(p.z==='read'&&zn.z==='hand')ret.push(uid);
    else other.push([uid,p,zn]);
  });
  burn.sort(function(a,b){return b[1]-a[1];});
  burn.forEach(function(b,j){map[b[0]]=360+j*130;});
  var base=burn.length?360+burn.length*130+80:440;
  draw.sort(function(a,b){return (a[1].z==='pending'?1:0)-(b[1].z==='pending'?1:0)||(a[1].k||0)-(b[1].k||0);});
  draw.forEach(function(d,j){map[d[0]]=base+j*200;});
  ret.forEach(function(u,j){map[u]=260+j*130;});
  other.forEach(function(o,j){var p=o[1],zn=o[2],uid=o[0];
    if(uid[0]==='b'){map[uid]=zn.z==='bookpile'?160+j*80:j*120;}
    else if(p.z==='seat')map[uid]=140;else map[uid]=0;});
  var mx=0;for(var k in map)mx=Math.max(mx,map[k]);
  return {map:reduced()?{}:map,end:reduced()?60:(Object.keys(map).length?mx+720:80)};
}

/* ───────── 행동 처리 ───────── */
function act(fn){
  if(busy||!st||st.over)return false;
  var prev=zones(),prevScore=st.score,prevLog=st.log.length;
  var ok=fn();
  if(!ok){layout(zones(),{});return false;}
  after(prev,prevScore,prevLog);
  return true;
}
function after(prev,prevScore,prevLog){
  var now=zones(),d=computeDelays(prev,now);
  layout(now,d.map);
  busy=true;selected=null;unmarkAll();
  updateHud();pushLog(prevLog);popScore(st.score-prevScore);updateTokens();updateLabels();
  hidePending();hideOffers();
  var nDraw=0;for(var k in d.map)nDraw++;
  if(nDraw)sfx('draw');
  var gain=st.score-prevScore;if(gain<0)sfx('bad');
  later(settle,d.end);
}
function settle(){
  busy=false;
  if(!st)return;
  if(st.over){busy=true;endTimer=later(showEnd,500);return;}
  renderPending();renderOffers();markHints();
}

      return act(function(){return resolve(st,{kind:'counter',hi:hi});});
    }
    toast(c.t==='ctr'?'무마 카드는 방해 카드 위에 올려서 써요.':'방해부터 처리해야 해요.');layout(zones(),{});return false;
  }
  if(zn==='discard')return act(function(){return discardCard(st,hi);});
  if(zn==='seat'||zn==='read'){

      if(zn==='read'){toast('자리 카드는 자리 칸에 내요.');layout(zones(),{});return false;}
      var ok=act(function(){return playSeat(st,hi);});if(ok)sfx('place');return ok;

      if(st.seat===null){toast('먼저 자리 카드를 내야 읽을 수 있어요.');layout(zones(),{});return false;}
      var ok2=act(function(){return playPage(st,hi);});if(ok2)sfx('flip');return ok2;
    }
    toast('무마 카드는 방해가 나왔을 때만 써요.');layout(zones(),{});return false;
  }

/* 시작 연출: 섞기 → 책 펼치기 → 뽑기 */
function shuffleAnim(){
  if(reduced())return 0;
  var keys=Object.keys(reg).filter(function(u){return u[0]==='c';}),n=keys.length;
  function jitter(side,delay){
    keys.forEach(function(u,j){
      var r=reg[u],T=target(u,{z:'deck',k:j,n:n}),dx=(j%2?1:-1)*(side?90:0),rr=(j%2?1:-1)*(side?7:0);
      r.el.style.transitionDelay=(delay?j*5:0)+'ms';
      r.el.style.transform='translate('+(T.x+dx-CW/2)+'px,'+(T.y-CH/2)+'px) rotate('+rr+'deg) scale('+T.s+')';
    });
  }
  jitter(true,true);later(function(){jitter(false,true);},520);
  later(function(){jitter(true,true);},1100);later(function(){jitter(false,true);},1620);
  sfx('flip');later(function(){sfx('flip');},1100);
  return 2500;
}
function restart(){ setup(); begin(); }
function begin(){
  var wait=shuffleAnim();
  later(function(){
    if(HAS_BOOK&&st.bookOffer){
      var Z=zones();layout(Z,(function(){var m={};st.bookOffer.forEach(function(bi,j){m['b'+bi]=j*160;});return m;})());
      later(function(){
        offerUp=true;var m2={};st.bookOffer.forEach(function(bi,j){m2['b'+bi]=j*180;});
        layout(zones(),m2);sfx('flip');
        later(function(){busy=false;renderOffers();$('live').textContent='읽을 책을 한 권 고르세요.';},700+st.bookOffer.length*180);
      },reduced()?60:1050);
    }else{
      var prev=fakeInitial();var now=zones();var d=computeDelays(prev,now);
      layout(now,d.map);updateTokens();updateLabels();busy=true;later(settle,d.end);
    }
  },wait);
}

/* ───────── 화면 맞춤·버튼 ───────── */
function fit(){
  var w=vp.clientWidth,h=vp.clientHeight,k=Math.min(w/W,h/H);
  if(!(k>0))return;stage.style.transform='translate(-50%,-50%) scale('+k+')';
}
window.addEventListener('resize',fit);
$('b-rules').addEventListener('click',function(){$('rulesbox').innerHTML='<h1 style="font-size:30px">규칙</h1>'+rulesHTML()+'<div class="row"><button class="btn pri" type="button" data-close="rules">닫기</button></div>';$('rules').classList.add('on');});
$('b-set').addEventListener('click',function(){$('s-hint').checked=prefs.hint;$('s-sound').checked=prefs.sound;$('s-reduce').checked=prefs.reduce;$('settings').classList.add('on');});
$('b-new').addEventListener('click',function(){if(booting)return;$('end').classList.remove('on');restart();});
stage.addEventListener('click',function(e){var c=e.target.getAttribute&&e.target.getAttribute('data-close');if(c)$(c).classList.remove('on');});
$('s-hint').addEventListener('change',function(e){prefs.hint=e.target.checked;savePrefs();if(st&&!busy)markHints();});
$('s-sound').addEventListener('change',function(e){prefs.sound=e.target.checked;savePrefs();if(prefs.sound)sfx('flip');});
$('s-reduce').addEventListener('change',function(e){prefs.reduce=e.target.checked;savePrefs();applyMotion();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){['rules','settings'].forEach(function(i){$(i).classList.remove('on');});}});
function applyMotion(){document.documentElement.style.setProperty('--dur',reduced()?'1ms':'620ms');}
if(reduceMq.addEventListener)reduceMq.addEventListener('change',applyMotion);

/* 시작 */
applyMotion();buildSlots();fit();setup();showIntro();booting=false;
window.__dokseo={state:function(){return st;},busy:function(){return busy;},offerUp:function(){return offerUp;},zones:function(){return zones();},reg:function(){return reg;},stageRect:function(){return stage.getBoundingClientRect();}};
})();
</script>
